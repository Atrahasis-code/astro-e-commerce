name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: 🧪 Run Vitest
        run: yarn test

  notify_on_failure:
    name: Create Issue on Failure
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
      - name: Create automated issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            if (!pr) {
              console.log("No PR context found, skipping issue creation.");
              return;
            }

            const title = `🚨 Falla en CI: Pruebas no pasaron en PR #${pr.number}`;
            const body = `### ❌ Pruebas automáticas fallidas
            
            El pipeline de integración continua ha detectado pruebas fallidas en el Pull Request #${pr.number} creado por @${pr.user.login}.
            
            **Rama origen:** \`${pr.head.ref}\`
            
            Para mantener la integridad tecnológica del E-commerce, no se puede realizar el merge a la rama principal hasta que todos los tests pasen exitosamente.
            
            #### Acciones requeridas:
            1. Revisa los logs detallados del [Workflow Fallido](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).
            2. Corrige los errores en la rama \`${pr.head.ref}\`.
            3. Haz push de los cambios. El pipeline se ejecutará nuevamente.
            
            [➡️ Ver Pull Request Original](${pr.html_url})
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              assignees: [pr.user.login],
              labels: ['bug', 'ci-failure', 'automated']
            });
